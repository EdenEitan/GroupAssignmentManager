name: Build
on:
  pull_request:
  push:
    branches: [main, interview-ready]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore backend/backend.csproj
      - run: dotnet build backend/backend.csproj --no-restore --configuration Release
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check API with MongoDB
        run: |
          dotnet run --project backend/backend.csproj --no-build --configuration Release --launch-profile http > /tmp/backend.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://localhost:5004/api/users > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/smoke.py || { cat /tmp/backend.log; exit 1; }
